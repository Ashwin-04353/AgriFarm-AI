<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login — AgriAI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center">
  <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8 w-full max-w-sm">
    <div class="text-green-400 font-bold text-lg mb-1">🌿 AgriAI</div>
    <h1 class="text-xl font-semibold mb-6">Sign in</h1>

    <div id="err" class="hidden bg-red-500/10 border border-red-500/30
         text-red-400 text-sm rounded-lg px-4 py-2 mb-4"></div>

    <div class="flex flex-col gap-4">
      <div>
        <label class="text-xs text-gray-400 mb-1 block">Email</label>
        <input id="email" type="email" placeholder="farmer@example.com"
               class="w-full bg-gray-800 border border-gray-700 rounded-lg
                      px-3 py-2 text-sm focus:outline-none focus:border-green-500">
      </div>
      <div>
        <label class="text-xs text-gray-400 mb-1 block">Password</label>
        <input id="password" type="password" placeholder="••••••••"
               class="w-full bg-gray-800 border border-gray-700 rounded-lg
                      px-3 py-2 text-sm focus:outline-none focus:border-green-500">
      </div>
      <button id="btn"
              class="bg-green-600 hover:bg-green-500 rounded-lg py-2
                     text-sm font-medium transition mt-1">
        Sign in
      </button>
    </div>

    <p class="text-xs text-gray-500 mt-4 text-center">
      No account?
      <a href="register.html" class="text-green-400 hover:underline">Register</a>
    </p>
    <p class="text-xs text-gray-600 mt-2 text-center">
      Demo: demo@agriai.com / demo123
    </p>
  </div>

  <script type="module">
    import { login } from "../js/auth.js"
    document.getElementById("btn").addEventListener("click", async () => {
      const email    = document.getElementById("email").value.trim()
      const password = document.getElementById("password").value
      const err      = document.getElementById("err")
      err.classList.add("hidden")
      if (!email || !password) {
        err.textContent = "Please fill in all fields"
        err.classList.remove("hidden"); return
      }
      try {
        await login(email, password)
        window.location.href = "dashboard.html"
      } catch(e) {
        err.textContent = e.message
        err.classList.remove("hidden")
      }
    })
  </script>
</body>
</html>
