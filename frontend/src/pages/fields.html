<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Fields — AgriAI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex">
  <aside class="w-56 bg-gray-900 border-r border-gray-800 flex flex-col p-5 min-h-screen">
    <div class="text-green-400 font-bold mb-8">🌿 AgriAI</div>
    <nav class="flex flex-col gap-1 text-sm flex-1">
      <a href="dashboard.html" class="text-gray-400 hover:text-white px-3 py-2 rounded-lg">Dashboard</a>
      <a href="map.html"       class="text-gray-400 hover:text-white px-3 py-2 rounded-lg">Field Map</a>
      <a href="fields.html"    class="bg-green-500/10 text-green-400 px-3 py-2 rounded-lg">My Fields</a>
      <a href="alerts.html"    class="text-gray-400 hover:text-white px-3 py-2 rounded-lg">Alerts</a>
      <a href="query.html"     class="text-gray-400 hover:text-white px-3 py-2 rounded-lg">Ask Database</a>
    </nav>
  </aside>

  <main class="flex-1 p-7">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-xl font-semibold">My fields</h1>
      <button id="addBtn"
              class="bg-green-600 hover:bg-green-500 px-4 py-2
                     rounded-lg text-sm transition">+ Add field</button>
    </div>

    <div id="addForm" class="hidden bg-gray-900 border border-gray-800
                             rounded-xl p-5 mb-6 grid grid-cols-3 gap-4">
      <div>
        <label class="text-xs text-gray-400 mb-1 block">Field name</label>
        <input id="fName" type="text" placeholder="North Field"
               class="w-full bg-gray-800 border border-gray-700 rounded-lg
                      px-3 py-2 text-sm focus:outline-none focus:border-green-500">
      </div>
      <div>
        <label class="text-xs text-gray-400 mb-1 block">Area (ha)</label>
        <input id="fArea" type="number" step="0.1" placeholder="2.5"
               class="w-full bg-gray-800 border border-gray-700 rounded-lg
                      px-3 py-2 text-sm focus:outline-none focus:border-green-500">
      </div>
      <div>
        <label class="text-xs text-gray-400 mb-1 block">Soil type</label>
        <select id="fSoil"
                class="w-full bg-gray-800 border border-gray-700 rounded-lg
                       px-3 py-2 text-sm focus:outline-none focus:border-green-500">
          <option value="loam">Loam</option>
          <option value="clay">Clay</option>
          <option value="sandy">Sandy</option>
          <option value="silt">Silt</option>
          <option value="peat">Peat</option>
        </select>
      </div>
      <div>
        <label class="text-xs text-gray-400 mb-1 block">Latitude</label>
        <input id="fLat" type="number" step="0.0001" placeholder="13.0827"
               class="w-full bg-gray-800 border border-gray-700 rounded-lg
                      px-3 py-2 text-sm focus:outline-none focus:border-green-500">
      </div>
      <div>
        <label class="text-xs text-gray-400 mb-1 block">Longitude</label>
        <input id="fLon" type="number" step="0.0001" placeholder="80.2707"
               class="w-full bg-gray-800 border border-gray-700 rounded-lg
                      px-3 py-2 text-sm focus:outline-none focus:border-green-500">
      </div>
      <div class="flex items-end gap-2">
        <button id="saveBtn"
                class="bg-green-600 hover:bg-green-500 px-4 py-2
                       rounded-lg text-sm transition">Save</button>
        <button id="cancelBtn"
                class="bg-gray-800 hover:bg-gray-700 px-4 py-2
                       rounded-lg text-sm transition">Cancel</button>
      </div>
    </div>

    <div id="err" class="hidden bg-red-500/10 border border-red-500/30
         text-red-400 text-sm rounded-lg px-4 py-2 mb-4"></div>

    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr class="border-b border-gray-800 text-gray-400 text-xs">
            <th class="text-left py-3 pr-4">Name</th>
            <th class="text-left py-3 pr-4">Soil</th>
            <th class="text-left py-3 pr-4">Area (ha)</th>
            <th class="text-left py-3 pr-4">Latitude</th>
            <th class="text-left py-3 pr-4">Longitude</th>
            <th class="text-left py-3">Created</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </main>

  <script type="module">
    import { apiFetch, isLoggedIn } from "../js/api.js"
    if (!isLoggedIn()) { window.location.href = "login.html" }

    let farmId = 1

    async function load() {
      const fields = await apiFetch("/fields/")
      if (fields.length) farmId = fields[0].farm_id
      document.getElementById("tbody").innerHTML = fields.map(f=>`
        <tr class="border-b border-gray-800/50 hover:bg-gray-900/50">
          <td class="py-3 pr-4 font-medium">${f.name}</td>
          <td class="py-3 pr-4 text-gray-400">${f.soil_type}</td>
          <td class="py-3 pr-4 text-gray-400">${f.area_hectares??'—'}</td>
          <td class="py-3 pr-4 text-gray-400">${f.latitude??'—'}</td>
          <td class="py-3 pr-4 text-gray-400">${f.longitude??'—'}</td>
          <td class="py-3 text-gray-500 text-xs">
            ${(f.created_at||"").slice(0,10)}</td>
        </tr>`).join("")
    }

    document.getElementById("addBtn").addEventListener("click",()=>
      document.getElementById("addForm").classList.remove("hidden"))
    document.getElementById("cancelBtn").addEventListener("click",()=>
      document.getElementById("addForm").classList.add("hidden"))

    document.getElementById("saveBtn").addEventListener("click", async () => {
      const name = document.getElementById("fName").value.trim()
      const err  = document.getElementById("err")
      err.classList.add("hidden")
      if (!name){
        err.textContent="Field name required"
        err.classList.remove("hidden"); return
      }
      try {
        await apiFetch("/fields/", {
          method:"POST",
          body: JSON.stringify({
            farm_id: farmId, name,
            area_hectares: parseFloat(document.getElementById("fArea").value)||null,
            latitude:  parseFloat(document.getElementById("fLat").value)||null,
            longitude: parseFloat(document.getElementById("fLon").value)||null,
            soil_type: document.getElementById("fSoil").value
          })
        })
        document.getElementById("addForm").classList.add("hidden")
        load()
      } catch(e){
        err.textContent=e.message
        err.classList.remove("hidden")
      }
    })

    load()
  </script>
</body>
</html>
