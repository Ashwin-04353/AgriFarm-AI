<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register — AgriAI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center">
  <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8 w-full max-w-sm">
    <div class="text-green-400 font-bold text-lg mb-1">🌿 AgriAI</div>
    <h1 class="text-xl font-semibold mb-6">Create account</h1>

    <div id="err" class="hidden bg-red-500/10 border border-red-500/30
         text-red-400 text-sm rounded-lg px-4 py-2 mb-4"></div>
    <div id="ok" class="hidden bg-green-500/10 border border-green-500/30
         text-green-400 text-sm rounded-lg px-4 py-2 mb-4"></div>

    <div class="flex flex-col gap-4">
      <div>
        <label class="text-xs text-gray-400 mb-1 block">Full name</label>
        <input id="name" type="text" placeholder="Ravi Kumar"
               class="w-full bg-gray-800 border border-gray-700 rounded-lg
                      px-3 py-2 text-sm focus:outline-none focus:border-green-500">
      </div>
      <div>
        <label class="text-xs text-gray-400 mb-1 block">Email</label>
        <input id="email" type="email" placeholder="ravi@example.com"
               class="w-full bg-gray-800 border border-gray-700 rounded-lg
                      px-3 py-2 text-sm focus:outline-none focus:border-green-500">
      </div>
      <div>
        <label class="text-xs text-gray-400 mb-1 block">Password</label>
        <input id="password" type="password" placeholder="Min 8 characters"
               class="w-full bg-gray-800 border border-gray-700 rounded-lg
                      px-3 py-2 text-sm focus:outline-none focus:border-green-500">
      </div>
      <div>
        <label class="text-xs text-gray-400 mb-1 block">Role</label>
        <select id="role"
                class="w-full bg-gray-800 border border-gray-700 rounded-lg
                       px-3 py-2 text-sm focus:outline-none focus:border-green-500">
          <option value="farmer">Farmer</option>
          <option value="agronomist">Agronomist</option>
        </select>
      </div>
      <button id="btn"
              class="bg-green-600 hover:bg-green-500 rounded-lg py-2
                     text-sm font-medium transition mt-1">
        Create account
      </button>
    </div>
    <p class="text-xs text-gray-500 mt-4 text-center">
      Already have one?
      <a href="login.html" class="text-green-400 hover:underline">Login</a>
    </p>
  </div>

  <script type="module">
    import { register } from "../js/auth.js"
    document.getElementById("btn").addEventListener("click", async () => {
      const name = document.getElementById("name").value.trim()
      const email = document.getElementById("email").value.trim()
      const password = document.getElementById("password").value
      const role = document.getElementById("role").value
      const err = document.getElementById("err")
      const ok  = document.getElementById("ok")
      err.classList.add("hidden"); ok.classList.add("hidden")
      if (!name||!email||!password){
        err.textContent="Fill in all fields"
        err.classList.remove("hidden"); return
      }
      try {
        await register(name, email, password, role)
        ok.textContent="Account created! Redirecting..."
        ok.classList.remove("hidden")
        setTimeout(()=>window.location.href="login.html", 1500)
      } catch(e){
        err.textContent=e.message
        err.classList.remove("hidden")
      }
    })
  </script>
</body>
</html>
