<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Alerts — AgriAI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex">
  <aside class="w-56 bg-gray-900 border-r border-gray-800 flex flex-col p-5 min-h-screen">
    <div class="text-green-400 font-bold mb-8">🌿 AgriAI</div>
    <nav class="flex flex-col gap-1 text-sm flex-1">
      <a href="dashboard.html" class="text-gray-400 hover:text-white px-3 py-2 rounded-lg">Dashboard</a>
      <a href="map.html"       class="text-gray-400 hover:text-white px-3 py-2 rounded-lg">Field Map</a>
      <a href="fields.html"    class="text-gray-400 hover:text-white px-3 py-2 rounded-lg">My Fields</a>
      <a href="alerts.html"    class="bg-green-500/10 text-green-400 px-3 py-2 rounded-lg">Alerts</a>
      <a href="query.html"     class="text-gray-400 hover:text-white px-3 py-2 rounded-lg">Ask Database</a>
    </nav>
  </aside>

  <main class="flex-1 p-7">
    <h1 class="text-xl font-semibold mb-6">Alerts feed</h1>
    <div id="list" class="flex flex-col gap-3"></div>
  </main>

  <script type="module">
    import { apiFetch, isLoggedIn } from "../js/api.js"
    if (!isLoggedIn()) { window.location.href = "login.html" }

    const sevCls = {
      critical:"bg-red-500/10 border-red-500/30 text-red-400",
      high:    "bg-orange-500/10 border-orange-500/30 text-orange-400",
      medium:  "bg-yellow-500/10 border-yellow-500/30 text-yellow-400",
      low:     "bg-blue-500/10 border-blue-500/30 text-blue-400"
    }

    async function load() {
      const alerts = await apiFetch("/alerts/")
      const list = document.getElementById("list")
      if (!alerts.length) {
        list.innerHTML = `<div class="text-gray-500 text-sm">No active alerts</div>`
        return
      }
      list.innerHTML = alerts.map(a=>`
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-4
                    flex items-start justify-between gap-4">
          <div class="flex-1">
            <div class="flex items-center gap-2 mb-1 flex-wrap">
              <span class="text-xs px-2 py-0.5 rounded-full border
                ${sevCls[a.severity]||sevCls.low}">${a.severity}</span>
              <span class="text-xs text-gray-500">
                ${(a.alert_type||"").replace(/_/g," ")}</span>
              <span class="text-xs text-gray-600 ml-auto">${a.hours_ago}h ago</span>
            </div>
            <div class="text-sm text-gray-200 mb-1">${a.message||"—"}</div>
            <div class="text-xs text-gray-500">${a.field_name} · ${a.farm_name}</div>
          </div>
          ${!a.is_resolved
            ? `<button onclick="resolve(${a.id},this)"
                class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300
                       px-3 py-1.5 rounded-lg transition whitespace-nowrap">
                Resolve</button>`
            : `<span class="text-xs text-green-500">✓ Resolved</span>`}
        </div>`).join("")
    }

    window.resolve = async (id, btn) => {
      btn.textContent="..."; btn.disabled=true
      try {
        await apiFetch(`/alerts/${id}/resolve`, { method:"PUT" })
        load()
      } catch(e) {
        alert(e.message)
        btn.textContent="Resolve"; btn.disabled=false
      }
    }

    load()
  </script>
</body>
</html>
