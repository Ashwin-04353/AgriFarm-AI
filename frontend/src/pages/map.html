<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Field Map — AgriAI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <style>
    #map { height: calc(100vh - 56px); }
    .leaflet-popup-content-wrapper {
      background:#111827; color:#f9fafb;
      border:1px solid #374151; border-radius:10px;
    }
    .leaflet-popup-tip { background:#111827; }
  </style>
</head>
<body class="bg-gray-950 text-white">
  <nav class="flex items-center gap-4 px-5 py-3 bg-gray-900
              border-b border-gray-800 text-sm">
    <a href="dashboard.html" class="text-gray-400 hover:text-white">← Dashboard</a>
    <span class="text-gray-600">|</span>
    <span class="text-green-400 font-medium">Field Map</span>
    <a href="query.html" class="ml-auto text-green-400 hover:text-green-300 text-xs">
      Ask Database →
    </a>
  </nav>
  <div id="map"></div>

  <script type="module">
    import { apiFetch, isLoggedIn } from "../js/api.js"
    if (!isLoggedIn()) { window.location.href = "login.html" }

    const col = { healthy:"#4ade80", warning:"#facc15",
                  critical:"#f87171", unknown:"#9ca3af" }

    async function initMap() {
      const map = L.map("map").setView([20.5937, 78.9629], 5)
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        { attribution:"© OpenStreetMap contributors" }).addTo(map)

      const fields = await apiFetch("/analytics/dashboard")
      const valid  = fields.filter(f=>f.latitude&&f.longitude)

      valid.forEach(f => {
        const c = col[f.health_status]||"#9ca3af"
        L.circleMarker([f.latitude,f.longitude],{
          radius:14, fillColor:c, color:c,
          weight:2, opacity:.9, fillOpacity:.35
        }).bindPopup(`
          <div style="min-width:180px">
            <div style="font-weight:600;font-size:14px;margin-bottom:6px">
              ${f.field_name}</div>
            <div style="font-size:12px;color:#9ca3af;margin-bottom:8px">
              ${f.farm_name}</div>
            <table style="font-size:12px;width:100%">
              <tr><td style="color:#9ca3af">Crop</td>
                  <td style="text-align:right">${f.crop_name||"—"}</td></tr>
              <tr><td style="color:#9ca3af">Moisture</td>
                  <td style="text-align:right">${f.moisture_pct??'—'}%</td></tr>
              <tr><td style="color:#9ca3af">pH</td>
                  <td style="text-align:right">${f.ph??'—'}</td></tr>
              <tr><td style="color:#9ca3af">Stress</td>
                  <td style="text-align:right">${f.stress_index??'—'}</td></tr>
              <tr><td style="color:#9ca3af">Alerts</td>
                  <td style="text-align:right;color:#f87171">${f.open_alerts}</td></tr>
            </table>
            <div style="margin-top:8px;font-size:11px;color:${c};
                        font-weight:500;text-transform:uppercase">
              ${f.health_status}</div>
          </div>`).addTo(map)
      })

      if (valid.length > 0)
        map.fitBounds(L.latLngBounds(valid.map(f=>[f.latitude,f.longitude])),
                      { padding:[50,50] })
    }

    initMap()
  </script>
</body>
</html>
